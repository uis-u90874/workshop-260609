<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="page">
    <section class="timer-window" aria-label="ポモドーロタイマー">
      <header class="window-header">
        <h1 class="title">ポモドーロタイマー</h1>
        <div class="window-controls" aria-hidden="true">
          <span>-</span>
          <span>□</span>
          <span>×</span>
        </div>
      </header>

      <p class="mode-label" id="mode-label">作業中</p>

      <div class="progress-wrap" id="progress-wrap" role="img" aria-label="残り時間25分">
        <svg class="progress-ring" viewBox="0 0 220 220">
          <circle class="progress-bg" cx="110" cy="110" r="80"></circle>
          <circle class="progress-value" id="progress-value" cx="110" cy="110" r="80"></circle>
        </svg>
        <p class="time-left" id="time-left">25:00</p>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="primary-btn" type="button">開始</button>
        <button class="btn btn-outline" id="secondary-btn" type="button">リセット</button>
      </div>

      <section class="daily-card" aria-label="今日の進捗">
        <h2>今日の進捗</h2>
        <div class="stats-row">
          <div class="stat-item">
            <p class="stat-value">4</p>
            <p class="stat-label">完了</p>
          </div>
          <div class="stat-item">
            <p class="stat-value">1時間40分</p>
            <p class="stat-label">集中時間</p>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
